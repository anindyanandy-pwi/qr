<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>ঝটপট — মিটিং স্ক্রিন</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Hind+Siliguri:wght@400;600;700&family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f1ec,#0e0e0e);--ink:light-dark(#111,#f2f2f2);--mute:light-dark(#5b5b5b,#a8a8a8);--line:light-dark(#dcd8cf,#2a2a2a);--red:#e4002b;--card:light-dark(#fff,#181818);--stage:#141414}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Hind Siliguri","Hind",system-ui,sans-serif;overflow-x:clip;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:1240px;margin:0 auto;padding:0 16px 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}.brand svg{width:40px;height:40px;flex:none}
h1{font-size:23px;line-height:1.05;margin:0}.tag{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.2}
.lang{display:flex;gap:4px}.lang button{font:inherit;font-size:15px;min-height:40px;padding:0 9px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{font:inherit;font-weight:700;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--red);color:#fff;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.btn.dark{background:#262626;color:#fff;border:1px solid #3a3a3a}
button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sub{color:var(--mute);margin:6px 0 10px;font-size:15px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;max-width:560px;margin:30px auto;min-height:220px;border:3px dashed var(--ink);border-radius:22px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;padding:20px;text-align:center}
.pick b{font-size:28px;line-height:1.15}.pick span{color:var(--mute);font-size:15px}.pick.drag{border-color:var(--red)}
.pres{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.stage{background:var(--stage);border-radius:18px;padding:12px}
.zwrap{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:8px;touch-action:pan-x pan-y;scrollbar-color:#555 transparent}
#pWrap{max-height:calc(100vh - 200px)}
#vWrap{max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px)}
.zin{position:relative;width:max-content;margin:0 auto;line-height:0}
.zin canvas{display:block;background:#fff;border-radius:4px}
#pSlide{cursor:crosshair}
.dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 6px #e4002b55,0 0 18px 4px #e4002b88;pointer-events:none;transition:left .06s linear,top .06s linear;z-index:2}
.ctrl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctrl .btn{min-width:56px;font-size:22px;padding:0 12px}
.pg{font:800 20px/1 Archivo,system-ui,sans-serif;color:#fff;min-width:4.6em;text-align:center}
.zl{font:800 15px/1 Archivo,system-ui,sans-serif;color:#ccc;min-width:3.6em;text-align:center}
.sep{width:1px;height:28px;background:#3a3a3a;margin:0 4px}
.side .ticket{background:#fff;color:#111;border-radius:20px;overflow:hidden;box-shadow:0 18px 40px -18px #00000059}
.ticket .qr{padding:14px;aspect-ratio:1}.ticket .qr img,.ticket .qr canvas{width:100%!important;height:auto!important;image-rendering:pixelated}
.ticket .perf{border-top:2px dashed #d6d6d6;margin:0 18px}
.ticket .stub{padding:10px 18px 14px}.ticket small{color:#6b6b6b;font-size:13px;display:block}.ticket b{font:800 26px/1.1 Archivo,system-ui,sans-serif;letter-spacing:.1em}
.count{display:flex;align-items:center;gap:10px;margin:14px 0;font-weight:700}.count b{font:800 34px/1 Archivo,system-ui,sans-serif;color:var(--red)}
label.chk{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:15px;cursor:pointer}label.chk input{width:22px;height:22px;accent-color:var(--red)}
.status{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:600;margin:12px 0}
.status.bad{background:color-mix(in srgb,var(--red) 12%,var(--bg));color:light-dark(#9b001d,#ff8a9e);border-color:transparent}
body.viewer{background:var(--stage);color:#fff}body.viewer header h1{color:#fff}
body.viewer main{padding:0 8px 12px}
.vtop{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#ddd;font-size:15px;margin:0 4px 8px}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#fff}.live i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #e4002b44}
.live.off i{background:#777;box-shadow:none}
.bar{height:10px;border-radius:5px;background:#333;overflow:hidden;margin:30px auto 8px;max-width:420px}.bar i{display:block;height:100%;width:0;background:var(--red)}
.vmsg{text-align:center;color:#ddd;padding:0 16px}
#vLive{width:100%;margin-top:8px}
@media (max-width:860px){.pres{grid-template-columns:minmax(0,1fr)}.side{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center}.ticket .stub b{font-size:18px}#pWrap{max-height:70vh}}
@media (max-width:520px){body.viewer header{padding:8px 4px}body.viewer .tag{display:none}.ctrl .btn{min-width:48px}}
@media (prefers-reduced-motion:reduce){.dot{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="home.html"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#e4002b"/><rect x="8" y="8" width="13" height="13" rx="3" fill="none" stroke="#fff" stroke-width="3"/><rect x="12.5" y="12.5" width="4" height="4" rx="1" fill="#fff"/><path d="M20 31 31 20M23.5 20H31v7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <section id="vPick" hidden>
    <button class="pick" id="pick"><b data-t="pick"></b><span data-t="pickSub"></span></button>

        </div>

    <aside class="side">

      <div>
        <div class="count"><b id="nView">0</b><span data-t="watching"></span></div>
        <label class="chk"><input type="checkbox" id="oPtr" checked><span data-t="laser"></span></label>
        <label class="chk"><input type="checkbox" id="oDl"><span data-t="allowDl"></span></label>
        <button class="btn ghost" id="newDeck" data-t="newDeck" style="width:100%;margin-top:8px"></button>
      </div>
    </aside>
  </section>

  <section id="vView" hidden>
    <div class="vtop"><span class="live" id="live"><i></i><span id="liveTxt"></span></span><span id="vPg"></span></div>
    <div id="vLoad"><div class="bar"><i id="vBar"></i></div><p class="vmsg" id="vMsg"></p></div>
    <div class="zwrap" id="vWrap" hidden><div class="zin" id="vSlide"><canvas id="vCv"></canvas><div class="dot" id="vDot" hidden></div></div></div>
    <div class="ctrl" id="vCtrl" hidden>
      <button class="btn dark" id="vPrev" aria-label="previous">‹</button>
      <button class="btn dark" id="vOut" aria-label="zoom out">−</button><span class="zl" id="vZl">100%</span><button class="btn dark" id="vIn" aria-label="zoom in">+</button>
      <button class="btn dark" id="vNext" aria-label="next">›</button>
    </div>
    <button class="btn" id="vLive" data-t="backLive" hidden></button>
    <p class="vmsg" data-t="viewTip" style="font-size:13px;color:#999;margin-top:8px"></p>
    <div id="vSave" style="margin-top:8px"></div>
  </section>

  <div class="status" id="status" hidden></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
{
const T={
bn:{title:'মিটিং স্ক্রিন',tagline:'প্রজেক্টর ছাড়াই সবার ফোনে আপনার নকশা',pick:'PDF বা ছবি বেছে নিন',pickSub:'নকশা, স্লাইড, নোটিশ — সবাই নিজের ফোনে দেখবে; আপনি পাতা বদলালে বা বড় করলে সবার স্ক্রিনেও তাই হবে',presTip:'← → কী বা তীর দিয়ে পাতা বদলান। + / − বা Ctrl+মাউস-চাকা দিয়ে বড়-ছোট করুন — সবার ফোনে একই জায়গা বড় হবে। নকশার উপর মাউস রাখলে সবার ফোনে লাল বিন্দু দেখা যাবে।',code:'মিটিং কোড',watching:'জন দেখছেন',laser:'লাল পয়েন্টার দেখান',allowDl:'সবাইকে ফাইল সেভ করতে দিন',newDeck:'অন্য ফাইল দেখান',fit:'পুরো পাতা',live:'লাইভ',notLive:'আপনি নিজে দেখছেন',backLive:'লাইভে ফিরুন',viewTip:'দুই আঙুলে টেনে বা দুবার ছুঁয়ে বড় করুন। বড় অবস্থায় আঙুলে সরান।',joining:'মিটিংয়ে যুক্ত হচ্ছে…',slow:'যুক্ত হতে দেরি হচ্ছে… Wi‑Fi আর মোবাইল ডেটা বদলে চেষ্টা করুন।',loading:'নকশা আসছে',ended:'মিটিং শেষ হয়ে গেছে বা কোডটি ভুল।',lost:'সংযোগ কেটে গেছে। পেজটি আবার খুলুন।',save:'ফাইল সেভ করুন',noNet:'ইন্টারনেট পাওয়া যাচ্ছে না।',libFail:'এই ব্রাউজারে PDF খোলা গেল না। ফোনের সফটওয়্যার আপডেট করে বা Chrome-এ চেষ্টা করুন।',bad:'এই ফাইল খোলা গেল না (শুধু PDF ও ছবি)।',page:'পাতা'},
hi:{title:'मीटिंग स्क्रीन',tagline:'बिना प्रोजेक्टर के सबके फ़ोन पर आपका नक्शा',pick:'PDF या फ़ोटो चुनें',pickSub:'नक्शा, स्लाइड, नोटिस — सब अपने फ़ोन पर देखेंगे; आप पेज बदलें या ज़ूम करें तो सबकी स्क्रीन पर भी वही होगा',presTip:'← → कुंजी या तीर से पेज बदलें। + / − या Ctrl+माउस-व्हील से ज़ूम करें — सबके फ़ोन पर वही जगह बड़ी होगी। नक्शे पर माउस रखें तो सबके फ़ोन पर लाल बिंदु दिखेगा।',code:'मीटिंग कोड',watching:'लोग देख रहे हैं',laser:'लाल पॉइंटर दिखाएँ',allowDl:'सबको फ़ाइल सेव करने दें',newDeck:'दूसरी फ़ाइल दिखाएँ',fit:'पूरा पेज',live:'लाइव',notLive:'आप ख़ुद देख रहे हैं',backLive:'लाइव पर लौटें',viewTip:'दो उँगलियों से खींचें या दो बार छूकर बड़ा करें। बड़ा होने पर उँगली से सरकाएँ।',joining:'मीटिंग से जुड़ रहे हैं…',slow:'जुड़ने में देर हो रही है… Wi‑Fi और मोबाइल डेटा बदलकर देखें।',loading:'नक्शा आ रहा है',ended:'मीटिंग ख़त्म हो गई या कोड ग़लत है।',lost:'कनेक्शन टूट गया। पेज दोबारा खोलें।',save:'फ़ाइल सेव करें',noNet:'इंटरनेट नहीं मिल रहा।',libFail:'इस ब्राउज़र में PDF नहीं खुली। फ़ोन का सॉफ़्टवेयर अपडेट करें या Chrome में खोलें।',bad:'यह फ़ाइल नहीं खुली (सिर्फ़ PDF और फ़ोटो)।',page:'पेज'},
en:{title:'Meeting screen',tagline:'Your drawing on everyone’s phone — no projector',pick:'Choose a PDF or images',pickSub:'Drawings, slides, notices — everyone sees them on their own phone; when you turn a page or zoom in, their screens follow',presTip:'Use ← → keys or the arrows to change page. Zoom with + / − or Ctrl + mouse wheel — every phone zooms to the same spot. Hover over the drawing to show a red dot on every phone.',code:'Meeting code',watching:'watching',laser:'Show red pointer',allowDl:'Let everyone save the file',newDeck:'Show another file',fit:'Fit page',live:'Live',notLive:'You’re browsing on your own',backLive:'Back to live',viewTip:'Pinch or double-tap to zoom. Drag with one finger to move around when zoomed.',joining:'Joining the meeting…',slow:'Taking a while… try switching between Wi‑Fi and mobile data.',loading:'Loading the drawing',ended:'The meeting has ended or the code is wrong.',lost:'Connection lost. Open the page again.',save:'Save the file',noNet:'No internet connection.',libFail:'This browser couldn’t open PDFs. Update the phone’s software or try Chrome.',bad:'Couldn’t open this file (PDF and images only).',page:'Page'}};
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('qrp-lang');if(!T[lang])lang=/^hi/.test(navigator.language)?'hi':/^en/.test(navigator.language)?'en':'bn';
const t=k=>T[lang][k]??k;
let stK='',stC='';
function setStatus(k,c=''){stK=k;stC=c;const s=$('#status');s.hidden=!k;s.className='status '+c;s.textContent=k?t(k):''}
let role='',vcur=0,follow=true,liveCur=0;
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));setStatus(stK,stC);document.title='ঝটপট — '+t('title');renderPg();renderLive()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('qrp-lang',lang);applyLang()});
const PREFIX='jppres-';
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},
  /* free relay used when phones can't connect directly (mobile data / strict Wi-Fi); traffic stays encrypted end-to-end */
  {urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}]};
const base=location.href.split('#')[0].split('?')[0];
const rid=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('');
let wake=null;async function lock(){if(wake)return;try{wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock()});

let pdfP=null;
function loadPdf(){
  if(!pdfP)pdfP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{if(!window.pdfjsLib)return rej(new Error('pdfjs'));pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(pdfjsLib)};
    s.onerror=()=>rej(new Error('pdfjs'));document.head.append(s)});
  return pdfP;
}

let files=[],slides=[],cur=0;const docs={};
const isPdf=f=>/pdf/.test(f.type)||/\.pdf$/i.test(f.name);
async function buildSlides(list){
  const out=[];
  for(let i=0;i<list.length;i++){const f=list[i];
    if(isPdf(f)){let lib;try{lib=await loadPdf()}catch(e){setStatus('libFail','bad');throw e}
      const d=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;docs[i]=d;for(let p=1;p<=d.numPages;p++)out.push({fi:i,p})}
    else if(/^image\//.test(f.type)||/\.(png|jpe?g|webp|gif)$/i.test(f.name)){docs[i]=await loadImg(f);out.push({fi:i,p:0})}
  }
  return out;
}
function loadImg(f){if(window.createImageBitmap)return createImageBitmap(f).catch(()=>viaImg(f));return viaImg(f)}
function viaImg(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f)})}

/* ---------- zoomable views (presenter + viewer) ---------- */
const MAXPX=8e6; // keep each canvas under ~8 megapixels (iPhone Safari memory limits)
function mkView(cv,wrap,zl,dot,pres){return{cv,wrap,zl,dot,pres,z:1,base:0,asp:1.4,seq:0,rt:0}}
const PV=mkView($('#pCv'),$('#pWrap'),$('#pZl'),$('#pDot'),true);
const VV=mkView($('#vCv'),$('#vWrap'),$('#vZl'),$('#vDot'),false);
const slideOf=V=>slides[V.pres?cur:vcur];
function sizeCss(V){const w=V.base*V.z;V.cv.style.width=w+'px';V.cv.style.height=(w*V.asp)+'px'}
async function render(V){
  const s=slideOf(V);if(!s)return;const my=++V.seq,src=docs[s.fi],dpr=Math.min(2.5,window.devicePixelRatio||1);
  let pg=null;if(s.p){pg=await src.getPage(s.p);const v=pg.getViewport({scale:1});V.asp=v.height/v.width}else V.asp=(src.height||1)/(src.width||1);
  if(my!==V.seq)return;
  let W=V.wrap.clientWidth||320;
  if(V.pres){const fitH=Math.max(220,(innerWidth>860?innerHeight-200:innerHeight*.7));if(W*V.asp>fitH)W=fitH/V.asp}
  V.base=Math.max(160,W);sizeCss(V);
  let px=Math.round(V.base*V.z*dpr);px=Math.min(px,Math.floor(Math.sqrt(MAXPX/V.asp)));
  if(pg){const v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:px/v0.width});
    const off=document.createElement('canvas');off.width=Math.floor(vp.width);off.height=Math.floor(vp.height);
    await pg.render({canvasContext:off.getContext('2d'),viewport:vp}).promise;
    if(my===V.seq){V.cv.width=off.width;V.cv.height=off.height;V.cv.getContext('2d').drawImage(off,0,0)}
    off.width=off.height=0;
  }else{V.cv.width=px;V.cv.height=Math.round(px*V.asp);const x=V.cv.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,V.cv.width,V.cv.height)}
}
function center(V){const r=V.cv.getBoundingClientRect(),w=V.wrap.getBoundingClientRect();
  return{x:Math.max(0,Math.min(1,(w.left+w.width/2-r.left)/(r.width||1))),y:Math.max(0,Math.min(1,(w.top+w.height/2-r.top)/(r.height||1)))}}
function setZoom(V,z,cx,cy){
  const c=cx==null?center(V):{x:cx,y:cy};
  V.z=Math.max(1,Math.min(6,Math.round(z*100)/100));sizeCss(V);
  const w=V.base*V.z,h=w*V.asp;V.wrap.scrollLeft=c.x*w-V.wrap.clientWidth/2;V.wrap.scrollTop=c.y*h-V.wrap.clientHeight/2;
  V.zl.textContent=Math.round(V.z*100)+'%';
  clearTimeout(V.rt);V.rt=setTimeout(()=>render(V),220);
  if(V.pres)sendView();
}
function placeDot(V,pt){if(!pt||pt.x==null){V.dot.hidden=true;return}V.dot.hidden=false;V.dot.style.left=(pt.x*V.cv.clientWidth)+'px';V.dot.style.top=(pt.y*V.cv.clientHeight)+'px'}
function gestures(V,onUser){
  let d0=0,z0=1,mid=null,sx=0,sy=0,moved=false,lastTap=0;
  V.wrap.addEventListener('touchstart',e=>{
    if(e.touches.length===2){const[a,b]=e.touches;d0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);z0=V.z;const r=V.cv.getBoundingClientRect();mid={x:((a.clientX+b.clientX)/2-r.left)/r.width,y:((a.clientY+b.clientY)/2-r.top)/r.height}}
    else if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false}
  },{passive:true});
  V.wrap.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&d0){e.preventDefault();const[a,b]=e.touches;setZoom(V,z0*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/d0,mid.x,mid.y);onUser&&onUser()}
    else if(e.touches.length===1&&Math.hypot(e.touches[0].clientX-sx,e.touches[0].clientY-sy)>12)moved=true;
  },{passive:false});
  V.wrap.addEventListener('touchend',e=>{
    if(e.touches.length)return;
    if(d0){d0=0;return}
    const tc=e.changedTouches[0],dx=tc.clientX-sx;
    if(V.z<=1.01&&moved&&Math.abs(dx)>60&&!V.pres){onUser&&onUser();vgo(vcur+(dx<0?1:-1));return}
    if(!moved){const n=Date.now();if(n-lastTap<320){const r=V.cv.getBoundingClientRect();setZoom(V,V.z>1.2?1:2.5,(tc.clientX-r.left)/r.width,(tc.clientY-r.top)/r.height);onUser&&onUser();lastTap=0}else lastTap=n}
  },{passive:true});
  V.wrap.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const r=V.cv.getBoundingClientRect();setZoom(V,V.z*(e.deltaY<0?1.15:1/1.15),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);onUser&&onUser()},{passive:false});
}
document.addEventListener('gesturestart',e=>{if(e.target.closest&&e.target.closest('.zwrap'))e.preventDefault()});
function renderPg(){if(role==='pres'&&slides.length)$('#pPg').textContent=(cur+1)+' / '+slides.length;if(role==='view'&&slides.length)$('#vPg').textContent=t('page')+' '+(vcur+1)+' / '+slides.length}
window.addEventListener('resize',()=>{if(role==='pres'&&slides.length)render(PV);if(role==='view'&&slides.length)render(VV)});

/* ================= PRESENTER ================= */
let peer=null,code='',viewers=new Set(),lastPt=null;
function presenter(){
  role='pres';$('#vPick').hidden=false;
  const pk=$('#pick');pk.onclick=()=>$('#file').click();
  $('#file').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)load(fs)};
  ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();pk.classList.add('drag')}));
  ['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();pk.classList.remove('drag')}));
  document.addEventListener('drop',e=>{const fs=[...e.dataTransfer.files];if(fs.length)load(fs)});
  gestures(PV,null);
  PV.wrap.addEventListener('scroll',()=>{if(PV.z>1)sendView()},{passive:true});
}
async function load(list){
  setStatus('');
  try{const s=await buildSlides(list);if(!s.length)throw 0;files=list;slides=s;cur=0}catch(e){if(stK!=='libFail')setStatus('bad','bad');return}
  $('#vPick').hidden=true;$('#vPres').hidden=false;PV.z=1;PV.zl.textContent='100%';await render(PV);renderPg();lock();
  if(!peer)goLive();else for(const c of viewers)sendDeck(c);
}
function goLive(){
  code=rid(6);peer=new Peer(PREFIX+code,{config:ICE});
  peer.on('open',()=>{$('#qr').innerHTML='';new QRCode($('#qr'),{text:base+'#'+code,width:480,height:480,correctLevel:QRCode.CorrectLevel.L});$('#code').textContent=code.slice(0,3)+' '+code.slice(3)});
  peer.on('connection',c=>{c.on('open',()=>{viewers.add(c);count();sendDeck(c)});c.on('close',()=>{viewers.delete(c);count()});c.on('error',()=>{viewers.delete(c);count()})});
  peer.on('disconnected',()=>{setTimeout(()=>{try{if(peer&&peer.disconnected)peer.reconnect()}catch(e){}},2000)});
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();peer=null;goLive()}else if(/network|server|socket/.test(e.type))setStatus('noNet','bad')});
}
function count(){$('#nView').textContent=viewers.size}
function jsend(c,o){try{c.open&&c.send(JSON.stringify(o))}catch(e){}}
async function sendDeck(c){
  const deck=c.deckSeq=(c.deckSeq||0)+1;
  jsend(c,{t:'deck',dl:$('#oDl').checked,files:files.map(f=>({name:f.name,mime:f.type,size:f.size})),cur});
  const dc=c.dataChannel;dc.bufferedAmountLowThreshold=1<<20;
  const max=Math.min(65536,(c.peerConnection&&c.peerConnection.sctp&&c.peerConnection.sctp.maxMessageSize)||65536);
  for(let i=0;i<files.length;i++){
    jsend(c,{t:'f',i});let off=0;const f=files[i];
    while(off<f.size){if(!c.open||c.deckSeq!==deck)return;if(dc.bufferedAmount>4<<20)await new Promise(r=>dc.addEventListener('bufferedamountlow',r,{once:true}));
      const b=await f.slice(off,off+max).arrayBuffer();c.send(b);off+=b.byteLength}
    jsend(c,{t:'e',i});
  }
  jsend(c,{t:'go',i:cur});jsend(c,viewMsg());if(lastPt)jsend(c,{t:'pt',...lastPt});
}
function bcast(o){for(const c of viewers)jsend(c,o)}
function viewMsg(){const c=center(PV);return{t:'view',z:PV.z,x:c.x,y:c.y}}
let vT=0,vTrail=0;function sendView(){const n=Date.now();clearTimeout(vTrail);if(n-vT>90){vT=n;bcast(viewMsg())}else vTrail=setTimeout(()=>{vT=Date.now();bcast(viewMsg())},100)}
async function go(i){if(!slides.length)return;cur=Math.max(0,Math.min(slides.length-1,i));lastPt=null;PV.dot.hidden=true;PV.z=1;PV.zl.textContent='100%';renderPg();bcast({t:'go',i:cur});await render(PV);PV.wrap.scrollTop=PV.wrap.scrollLeft=0;bcast(viewMsg())}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#pIn').onclick=()=>setZoom(PV,PV.z*1.35);$('#pOut').onclick=()=>setZoom(PV,PV.z/1.35);$('#pFit').onclick=()=>setZoom(PV,1,.5,.5);
document.addEventListener('keydown',e=>{
  if(role==='pres'&&!$('#vPres').hidden){if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
    if(e.key==='+'||e.key==='='){setZoom(PV,PV.z*1.35)}if(e.key==='-'){setZoom(PV,PV.z/1.35)}if(e.key==='0'){setZoom(PV,1,.5,.5)}}
  if(role==='view'){if(e.key==='ArrowRight'){mine();vgo(vcur+1)}if(e.key==='ArrowLeft'){mine();vgo(vcur-1)}}});
let ptT=0,ptTrail=0;
function ptFrom(e){const r=PV.cv.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
$('#pSlide').addEventListener('pointermove',e=>{if(!$('#oPtr').checked||e.pointerType==='touch')return;lastPt=ptFrom(e);placeDot(PV,lastPt);const n=Date.now();clearTimeout(ptTrail);
  if(n-ptT>45){ptT=n;bcast({t:'pt',...lastPt})}else ptTrail=setTimeout(()=>{if(lastPt){ptT=Date.now();bcast({t:'pt',...lastPt})}},50)});
$('#pSlide').addEventListener('pointerleave',()=>{lastPt=null;PV.dot.hidden=true;bcast({t:'pt',x:null})});
$('#oPtr').onchange=()=>{if(!$('#oPtr').checked){lastPt=null;PV.dot.hidden=true;bcast({t:'pt',x:null})}};
$('#oDl').onchange=()=>bcast({t:'dl',on:$('#oDl').checked});
$('#newDeck').onclick=()=>$('#file').click();

/* ================= VIEWER ================= */
let canDl=false,vconn=null,lastView=null,lastPtMsg=null;
function renderLive(){if(role!=='view')return;$('#live').classList.toggle('off',!follow);$('#liveTxt').textContent=t(follow?'live':'notLive');$('#vLive').hidden=follow}
function mine(){if(follow){follow=false;renderLive()}}
function viewer(c){
  role='view';document.body.classList.add('viewer');$('#vView').hidden=false;$('#vMsg').textContent=t('joining');renderLive();lock();
  gestures(VV,mine);
  const slowT=setTimeout(()=>{if(!(vconn&&vconn.open))$('#vMsg').textContent=t('slow')},15000);
  const p=new Peer({config:ICE});
  p.on('open',()=>{
    vconn=p.connect(PREFIX+c,{serialization:'raw',reliable:true});
    let deck=null,rx=null;
    vconn.on('open',()=>{clearTimeout(slowT);$('#vMsg').textContent=t('loading')});
    vconn.on('data',async d=>{
      if(typeof d!=='string'){if(rx){rx.parts.push(d);rx.got+=d.byteLength??d.size??0;prog()}return}
      let m;try{m=JSON.parse(d)}catch(e){return}
      if(m.t==='deck'){deck={files:m.files,blobs:[],total:m.files.reduce((a,f)=>a+f.size,0),got:0};canDl=!!m.dl;liveCur=m.cur||0;$('#vLoad').hidden=false;$('#vWrap').hidden=true;$('#vCtrl').hidden=true;$('#vSave').innerHTML='';$('#vMsg').textContent=t('loading')}
      else if(m.t==='f'&&deck){rx={i:m.i,parts:[],got:0}}
      else if(m.t==='e'&&deck&&rx){const f=deck.files[rx.i];deck.blobs[rx.i]=new File(rx.parts,f.name,{type:f.mime});deck.got+=rx.got;rx=null;
        if(deck.blobs.filter(Boolean).length===deck.files.length){files=deck.blobs;try{slides=await buildSlides(files)}catch(e){if(stK!=='libFail')setStatus('bad','bad');return}
          $('#vLoad').hidden=true;$('#vWrap').hidden=false;$('#vCtrl').hidden=false;follow=true;renderLive();await vgo(liveCur);if(lastView)applyView(lastView);saveBtn()}}
      else if(m.t==='go'){liveCur=m.i;if(follow&&slides.length){VV.z=1;VV.zl.textContent='100%';await vgo(m.i)}}
      else if(m.t==='view'){lastView=m;if(follow&&slides.length&&vcur===liveCur)applyView(m)}
      else if(m.t==='pt'){lastPtMsg=m;if(follow&&vcur===liveCur)placeDot(VV,m)}
      else if(m.t==='dl'){canDl=m.on;saveBtn()}
      function prog(){if(!deck)return;$('#vBar').style.width=Math.min(100,(deck.got+(rx?rx.got:0))/Math.max(1,deck.total)*100)+'%'}
    });
    vconn.on('close',()=>setStatus('lost','bad'));
  });
  p.on('error',e=>setStatus(e.type==='peer-unavailable'?'ended':/network|server|socket/.test(e.type)?'noNet':'lost','bad'));
}
function applyView(m){if(!VV.base)return;setZoom(VV,m.z,m.x,m.y)}
function saveBtn(){const box=$('#vSave');box.innerHTML='';if(!canDl)return;files.forEach(f=>{const a=document.createElement('a');a.className='btn dark';a.style.cssText='display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:8px';a.href=URL.createObjectURL(f);a.download=f.name;a.textContent=t('save')+' — '+f.name;box.append(a)})}
async function vgo(i){if(!slides.length)return;vcur=Math.max(0,Math.min(slides.length-1,i));if(vcur!==liveCur&&follow){follow=false}renderLive();VV.dot.hidden=true;renderPg();await render(VV);VV.wrap.scrollTop=VV.wrap.scrollLeft=0}
$('#vPrev').onclick=()=>{mine();vgo(vcur-1)};$('#vNext').onclick=()=>{mine();vgo(vcur+1)};
$('#vIn').onclick=()=>{mine();setZoom(VV,VV.z*1.35)};$('#vOut').onclick=()=>{mine();setZoom(VV,VV.z/1.35)};
$('#vLive').onclick=async()=>{follow=true;renderLive();VV.z=1;VV.zl.textContent='100%';await vgo(liveCur);if(lastView)applyView(lastView);if(lastPtMsg)placeDot(VV,lastPtMsg)};

applyLang();
if(typeof Peer==='undefined'||typeof QRCode==='undefined'){setStatus('noNet','bad')}
else{const h=location.hash.slice(1);if(/^[a-z0-9]{6}$/.test(h))viewer(h);else presenter()}
window.addEventListener('hashchange',()=>location.reload());
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__jpPres={PV,VV,setZoom,center,get follow(){return follow}};
}
</script>
