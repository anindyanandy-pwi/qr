<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e4002b">
<title>ঝটপট — নেটওয়ার্ক ছাড়া</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Hind+Siliguri:wght@400;600;700&family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: field kit — sturdy, plain, works anywhere
   IDEA: a signal lamp: the screen flashes code, the other phone reads it
   PICTURE: the big animated QR (send) or the camera window (receive)
   COLOUR and TYPE: warm paper, ink, signal red; Hind Siliguri/Hind, Archivo numerals
   LAYOUT: one column; mode switch, then one big working area */
:root{color-scheme:light dark;--bg:light-dark(#f3f1ec,#0e0e0e);--ink:light-dark(#111,#f2f2f2);--mute:light-dark(#5b5b5b,#a8a8a8);--line:light-dark(#dcd8cf,#2a2a2a);--red:#e4002b;--card:light-dark(#fff,#181818);--ok:light-dark(#0a7a3d,#4cd38a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Hind Siliguri","Hind",system-ui,sans-serif;overflow-x:clip}
main{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 16px}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:40px;height:40px;flex:none}
h1{font-size:23px;line-height:1.05;margin:0}.tag{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.2}
.lang{display:flex;gap:4px}.lang button{font:inherit;font-size:15px;min-height:40px;padding:0 9px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{font:inherit;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:72px}
.seg button b{display:block;font-size:17px;line-height:1.2}.seg button span{font-size:13px;color:var(--mute);line-height:1.3;display:block;margin-top:2px}
.seg button[aria-pressed=true]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.btn{font:inherit;font-weight:700;min-height:52px;padding:0 18px;border-radius:12px;border:0;background:var(--red);color:#fff;cursor:pointer;width:100%}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.btn.ink{background:var(--ink);color:var(--bg)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 6px}.lv button{font:inherit;padding:8px 6px;border-radius:12px;border:2px solid var(--line);background:none;color:var(--ink);cursor:pointer;text-align:center;min-height:58px}.lv button b{display:block;font-size:16px;line-height:1.2}.lv button span{display:block;font-size:12px;color:var(--mute);line-height:1.2}.lv button[aria-pressed=true]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sub{color:var(--mute);margin:6px 0 10px;font-size:15px}
.qrwrap{background:#fff;border-radius:18px;padding:12px;width:min(100%,460px);margin:0 auto;aspect-ratio:1;display:grid;place-items:center}
.qrwrap canvas,.qrwrap img{width:100%!important;height:auto!important;image-rendering:pixelated}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:60vh;margin:0 auto}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam i{position:absolute;inset:14%;border:3px solid #fff8;border-radius:16px;box-shadow:0 0 0 999px #0005}
.big{font:800 34px/1 Archivo,system-ui,sans-serif;text-align:center;margin:12px 0 4px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.status{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:600;margin:12px 0}
.status.bad{background:color-mix(in srgb,var(--red) 12%,var(--bg));color:light-dark(#9b001d,#ff8a9e);border-color:transparent}
.status.good{color:var(--ok)}
label.chk{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:15px}label.chk input{width:22px;height:22px;accent-color:var(--red)}
input[type=range]{width:100%;accent-color:var(--red)}
.files{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.files li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.files .nm{font-weight:600;overflow-wrap:anywhere;line-height:1.25}.files .mt{font-size:13px;color:var(--mute)}
.files a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700}
.preview{max-width:100%;border-radius:12px;margin-top:10px}
ol.how{margin:6px 0 0;padding-left:1.3em;font-size:15px;color:var(--mute)}ol.how li{margin:3px 0}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#e4002b"/><rect x="8" y="8" width="13" height="13" rx="3" fill="none" stroke="#fff" stroke-width="3"/><rect x="12.5" y="12.5" width="4" height="4" rx="1" fill="#fff"/><path d="M20 31 31 20M23.5 20H31v7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1 data-t="title"></h1><div class="tag" data-t="tagline"></div></div></div>
    <div class="lang"><button data-l="bn">বাংলা</button><button data-l="hi">हिंदी</button><button data-l="en">EN</button></div>
  </header>

  <div class="seg" role="group">
    <button id="mQr" aria-pressed="true"><b data-t="mQr"></b><span data-t="mQrSub"></span></button>
    <button id="mHs" aria-pressed="false"><b data-t="mHs"></b><span data-t="mHsSub"></span></button>
  </div>

  <!-- ===== Animated QR ===== -->
  <section id="vQr">
    <div class="card" id="qrHome">
      <div class="row2"><button class="btn" id="qSend" data-t="send"></button><button class="btn ink" id="qRecv" data-t="recv"></button></div>
      <p class="sub" data-t="qrHow"></p>
    </div>
    <div id="qrSendBox" hidden>
      <div class="card">
        <button class="btn ghost" id="qPick" data-t="pick"></button><input type="file" id="qFile" hidden>
        <label class="chk"><input type="checkbox" id="qShrink" checked><span data-t="shrink"></span></label>
        <div class="lv" id="qLevel" role="group"><button data-lv="0"><b data-t="lv0"></b><span data-t="lv0s"></span></button><button data-lv="1"><b data-t="lv1"></b><span data-t="lv1s"></span></button><button data-lv="2"><b data-t="lv2"></b><span data-t="lv2s"></span></button></div>
        <p class="sub" id="qInfo" style="margin-bottom:0"></p><p class="sub" id="qEst" style="margin-top:2px;font-weight:700"></p>
      </div>
      <div id="qrStart" class="card" hidden style="text-align:center">
        <div class="big" data-t="step1"></div>
        <p class="sub" data-t="step1p"></p>
        <div class="qrwrap" id="qrStartBox" style="max-width:300px;margin:0 auto"></div>
        <p class="sub" data-t="step1n" style="font-size:13px"></p>
        <button class="btn" id="qGo" data-t="go" style="width:100%"></button>
      </div>
      <div id="qrAnim" hidden>
        <div class="qrwrap" id="qrBox"></div>
        <div class="big" id="qFrame"></div>
        <p class="sub" style="text-align:center" data-t="holdSteady"></p>
        <label class="sub" style="display:block"><span data-t="speed"></span> <b id="fpsV"></b><input type="range" id="fps" min="3" max="15" value="6"></label>
        <button class="btn ghost" id="qShowStart" data-t="showStart" style="width:100%;margin-bottom:8px"></button>
      </div>
      <button class="btn ghost" id="qBack1" data-t="back"></button>
    </div>
    <div id="qrRecvBox" hidden>
      <div class="cam"><video id="qVid" playsinline muted></video><i></i></div>
      <div class="bar"><i id="qBar"></i></div>
      <div class="big" id="qGot"></div>
      <p class="sub" data-t="recvTip" style="text-align:center"></p>
      <ul class="files" id="qOut"></ul>
      <button class="btn" id="qAgain" data-t="again" hidden style="width:100%;margin-top:10px"></button>
      <button class="btn ghost" id="qBack2" data-t="back" style="margin-top:12px"></button>
    </div>
  </section>

  <!-- ===== Hotspot ===== -->
  <section id="vHs" hidden>
    <div class="card" id="hsHome">
      <ol class="how"><li data-t="hs1"></li><li data-t="hs2"></li><li data-t="hs3"></li></ol>
      <div class="row2" style="margin-top:12px"><button class="btn" id="hStart" data-t="hStart"></button><button class="btn ink" id="hJoin" data-t="hJoin"></button></div>
    </div>
    <div id="hsQrBox" hidden>
      <p class="sub" id="hsQrMsg" style="text-align:center;font-weight:600;color:var(--ink)"></p>
      <div class="qrwrap" id="hsQr"></div>
      <button class="btn" id="hsScanReply" data-t="scanReply" style="margin-top:12px" hidden></button>
    </div>
    <div id="hsCamBox" hidden>
      <p class="sub" id="hsCamMsg" style="text-align:center;font-weight:600;color:var(--ink)"></p>
      <div class="cam"><video id="hVid" playsinline muted></video><i></i></div>
    </div>
    <div id="hsConn" hidden>
      <div class="card"><button class="btn" id="hPick" data-t="pickMany"></button><input type="file" id="hFile" multiple hidden></div>
      <ul class="files" id="hList"></ul>
    </div>
    <button class="btn ghost" id="hBack" data-t="back" style="margin-top:12px" hidden></button>
  </section>

  <div class="status" id="status" hidden></div>
  <p class="sub" style="text-align:center;margin-top:24px;font-size:14px"><a href="./" style="color:inherit" data-t="home"></a></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
{
const T={

function nativeDetector(){/* Android Chrome has a fast built-in QR reader */
  if(!detP)detP=(async()=>{try{if('BarcodeDetector' in window&&(await BarcodeDetector.getSupportedFormats()).includes('qr_code'))return new BarcodeDetector({formats:['qr_code']})}catch(e){}return null})();return detP}
async function startScan(video,onText){
  stopScan();
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){setStatus('camNo','bad');return false}
  window.__jpScanCb=onText;
  video.srcObject=camStream;await video.play().catch(()=>{});
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const det=await nativeDetector();let busy=false;
  const tick=()=>{
    if(!camStream)return;
    if(video.readyState>=2&&video.videoWidth&&!busy){
      if(det){busy=true;det.detect(video).then(rs=>{for(const r of rs)if(r.rawValue)onText(r.rawValue)}).catch(()=>{}).finally(()=>{busy=false})}
      else{const vw=video.videoWidth,vh=video.videoHeight,sq=Math.min(vw,vh)*.9,k=Math.min(1,800/sq);
        cv.width=cv.height=sq*k|0;cx.drawImage(video,(vw-sq)/2,(vh-sq)/2,sq,sq,0,0,cv.width,cv.height);
        const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});
        if(r&&r.data)onText(r.data)}
    }
    camRAF=requestAnimationFrame(tick);
  };
  camRAF=requestAnimationFrame(tick);return true;
}
function stopScan(){cancelAnimationFrame(camRAF);if(camStream){camStream.getTracks().forEach(x=>x.stop());camStream=null}}
function stopAll(){stopScan();stopAnim();if(pc){try{pc.close()}catch(e){}pc=null;dc=null}

/* ================= Animated QR v2: fountain-coded frames =================
   The file is cut into K blocks. Every frame is a random XOR mix of blocks (LT / "fountain" code), so the
   receiver can rebuild the file from ANY ~K+10% frames it manages to catch —
   missed frames cost nothing and there is no waiting for the loop to come round. */
const LV=[{B:110,f:6},{B:200,f:8},{B:340,f:10}];
let lv=+(store.get('jp-qlv')||0);if(!LV[lv])lv=0;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function idNum(id){let h=2166136261;for(const c of id)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const cdfCache={};
function solitonCdf(K){
  if(cdfCache[K])return cdfCache[K];
  const c=.05,dl=.5,R=Math.max(1,c*Math.log(K/dl)*Math.sqrt(K)),p=new Float64Array(K+1);
  p[1]=1/K;for(let d=2;d<=K;d++)p[d]=1/(d*(d-1));
  const piv=Math.min(K,Math.max(1,Math.floor(K/R)));
  for(let d=1;d<piv;d++)p[d]+=R/(d*K);p[piv]+=Math.max(0,R*Math.log(R/dl)/K);
  let s=0;for(let d=1;d<=K;d++)s+=p[d];
  const cdf=new Float64Array(K+1);let a=0;for(let d=1;d<=K;d++){a+=p[d]/s;cdf[d]=a}
  return cdfCache[K]=cdf;
}
function blocksFor(id,K,seed){
  const r=mulberry(idNum(id)^Math.imul(seed,2654435761)),cdf=solitonCdf(K),u=r();
  let d=1;while(d<K&&cdf[d]<u)d++;
  const set=new Set();while(set.size<d)set.add(Math.floor(r()*K));return[...set];
}
const xorInto=(a,b)=>{for(let i=0;i<a.length;i++)a[i]^=b[i]};

let curFile=null,sid='',K=0,B=0,size=0,data=null,meta='',seedN=0,frameN=0,animT=0,qr=null;
function stopAnim(){clearInterval(animT);animT=0}
async function shrink(file){
  if(!/^image\//.test(file.type)||/gif|svg/.test(file.type)||!$('#qShrink').checked||file.size<60*1024)return file;
  const img=await createImageBitmap(file);const k=Math.min(1,1024/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=img.width*k|0;c.height=img.height*k|0;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.6));
  return b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file;
}
async function prepare(f){
  B=LV[lv].B;const u=new Uint8Array(await f.arrayBuffer());size=u.length;K=Math.max(1,Math.ceil(size/B));
  data=new Uint8Array(K*B);data.set(u);sid=rid(4);seedN=0;frameN=0;
  meta='J2M|'+sid+'|'+b64.enc(new TextEncoder().encode(JSON.stringify({n:f.name.slice(0,60),m:f.type||'',h:await hex(u)})));
  $('#qInfo').textContent=f.name+' · '+fmt(size);estimate();
}
function nextFrame(){
  frameN++;if(frameN%8===1)return meta;
  const s=seedN++,out=new Uint8Array(B);
  for(const i of blocksFor(sid,K,s))xorInto(out,data.subarray(i*B,(i+1)*B));
  return 'J2|'+sid+'|'+size+'|'+B+'|'+s+'|'+b64.enc(out);
}
function showFrame(){const tx=nextFrame();window.__jpLastQr=tx;qr.makeCode(tx);$('#qFrame').textContent=t('frame')+' '+frameN}
function runAnim(){stopAnim();const f=+$('#fps').value;$('#fpsV').textContent=f+'/s';showFrame();animT=setInterval(showFrame,1000/f);estimate()}
function estimate(){
  if(!K)return;const f=+$('#fps').value,s=Math.ceil(K*1.08/(f*.7))+3;
  $('#qEst').textContent=t('estTime')+' '+(s<90?s+' '+t('sec'):Math.ceil(s/60)+' '+t('min'))+(s>180?' — '+t('slowHint'):'');
}

  if(curFile){const was=!!animT;await prepare(curFile);if(was)runAnim()}});
const rxUrl=()=>location.href.split('#')[0].split('?')[0]+'#rx';

/* for tests: a batch of frames (meta + n coded frames) */
async function buildFrames(file,extra=1.6){curFile=file;await prepare(file);const out=[meta];frameN=1;const n=Math.ceil(K*extra)+4;for(let i=0;i<n;i++){frameN=2;out.push(nextFrame())}return out}

/* ---------- receive ---------- */
let rx=null;
function rxReset(){rx={id:null,K:0,B:0,size:0,known:null,nKnown:0,by:null,eqs:[],seen:new Set(),metas:{},done:false,caught:0,lastGE:0}}
function rxInit(id,sz,b){rxReset();rx.id=id;rx.size=sz;rx.B=b;rx.K=Math.max(1,Math.ceil(sz/b));rx.known=new Array(rx.K).fill(null);rx.by=Array.from({length:rx.K},()=>[])}
function learn(i,buf){
  const q=[[i,buf]];
  while(q.length){const[b,v]=q.pop();if(rx.known[b])continue;rx.known[b]=v;rx.nKnown++;
    for(const e of rx.by[b]){if(!e.s.has(b))continue;e.s.delete(b);xorInto(e.d,v);if(e.s.size===1){const[j]=e.s;e.s.clear();q.push([j,e.d])}}
    rx.by[b]=[]}
}
function addEq(idx,buf){
  const rest=[];for(const i of idx){if(rx.known[i])xorInto(buf,rx.known[i]);else rest.push(i)}
  if(!rest.length)return;if(rest.length===1){learn(rest[0],buf);return}
  const e={s:new Set(rest),d:buf};rx.eqs.push(e);for(const i of rest)rx.by[i].push(e);
}
/* When simple peeling stalls but we already hold about as many frames as blocks,
   solve the remaining unknowns directly (Gauss-Jordan over GF(2)). */
function solveRest(){
  const eqs=rx.eqs=rx.eqs.filter(e=>e.s.size>0);
  const unk=[];const col=new Int32Array(rx.K).fill(-1);
  rx.known.forEach((v,i)=>{if(!v){col[i]=unk.length;unk.push(i)}});
  const U=unk.length;if(!U||eqs.length<U)return;
  const W=(U+31)>>>5,rows=eqs.map(e=>{const b=new Uint32Array(W);for(const i of e.s){const c=col[i];b[c>>>5]|=1<<(c&31)}return{b,d:e.d.slice()}});
  let rank=0;const piv=new Int32Array(U).fill(-1);
  for(let c=0;c<U&&rank<rows.length;c++){
    const w=c>>>5,m=1<<(c&31);let r=rank;while(r<rows.length&&!(rows[r].b[w]&m))r++;
    if(r===rows.length)continue;
    [rows[rank],rows[r]]=[rows[r],rows[rank]];const P=rows[rank];
    for(let k=0;k<rows.length;k++){if(k!==rank&&(rows[k].b[w]&m)){const R=rows[k];for(let j=0;j<W;j++)R.b[j]^=P.b[j];xorInto(R.d,P.d)}}
    piv[c]=rank++;
  }
  for(let c=0;c<U;c++){const r=piv[c];if(r<0)continue;const R=rows[r];let n=0;for(let j=0;j<W;j++){let x=R.b[j];while(x){x&=x-1;n++}}if(n===1)learn(unk[c],R.d)}
}
function onFrame(txt){
  if(!rx||rx.done)return;
  let m=/^J2M\|([a-z0-9]{4})\|(.+)$/.exec(txt);
  if(m){if(!rx.metas[m[1]]){try{rx.metas[m[1]]=JSON.parse(new TextDecoder().decode(b64.dec(m[2])))}catch(e){return}}progress();return}
  m=/^J2\|([a-z0-9]{4})\|(\d+)\|(\d+)\|(\d+)\|(.+)$/.exec(txt);
  if(!m){if(/^JP1\|/.test(txt))setStatus('oldQr','bad');return}
  const[,id,sz,bs,sd,d]=m,seed=+sd;
  if(rx.id!==id){const metas=rx.metas;rxInit(id,+sz,+bs);rx.metas=metas}
  if(rx.seen.has(seed))return;rx.seen.add(seed);rx.caught++;
  let buf;try{buf=b64.dec(d)}catch(e){return}if(buf.length!==rx.B)return;
  addEq(blocksFor(id,rx.K,seed),buf);
  if(rx.nKnown<rx.K&&rx.caught>=rx.K&&rx.caught-rx.lastGE>=Math.max(3,rx.K>>5)){rx.lastGE=rx.caught;solveRest()}
  progress();
}
function progress(){
  if(stK==='looking'||stK==='oldQr')setStatus('reading');
  if(!rx.K){$('#qGot').textContent=t('waitData');return}
  const pct=rx.nKnown===rx.K?100:Math.min(99,Math.floor(Math.max(rx.nKnown,rx.caught/1.06)/rx.K*100));
  $('#qBar').style.width=pct+'%';$('#qGot').textContent=t('got')+' '+pct+'%';
  if(rx.nKnown===rx.K){if(rx.metas[rx.id])finishRx();else $('#qGot').textContent=t('waitName')}
}
async function finishRx(){
  rx.done=true;stopScan();
  const u=new Uint8Array(rx.K*rx.B);rx.known.forEach((b,i)=>u.set(b,i*rx.B));const file=u.subarray(0,rx.size),mt=rx.metas[rx.id];
  if(await hex(file)!==mt.h){setStatus('bad','bad');return}
  setStatus('done','good');try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}
  addOut($('#qOut'),new Blob([file],{type:mt.m||'application/octet-stream'}),mt.n||'file');
  $('#qAgain').hidden=false;
}
function addOut(list,blob,name){
  const li=document.createElement('li'),d=document.createElement('div');
  d.innerHTML='<div class="nm"></div><div class="mt"></div>';d.firstChild.textContent=name;d.lastChild.textContent=fmt(blob.size);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent=t('save');
  li.append(d,a);
  if(/^image\//.test(blob.type)){const im=new Image();im.className='preview';im.src=a.href;im.alt='';li.append(im);im.style.gridColumn='1/-1'}
  list.prepend(li);return li;
}
async function startRecv(){
  $('#qrHome').hidden=true;$('#qrRecvBox').hidden=false;$('#qAgain').hidden=true;$('#qBar').style.width='0';$('#qGot').textContent='';rxReset();setStatus('looking');
  await startScan($('#qVid'),onFrame);
}
$('#qRecv').onclick=startRecv;$('#qAgain').onclick=startRecv;

/* ================= Hotspot (WebRTC, no signalling server) ================= */
let pc=null,dc=null;
async function pack(o){const cs=new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(new TextEncoder().encode(JSON.stringify(o)));w.close();return b64.enc(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}
async function unpack(s){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(b64.dec(s));w.close();return JSON.parse(await new Response(ds.readable).text())}
function gathered(p){return new Promise(r=>{if(p.iceGatheringState==='complete')return r();const tm=setTimeout(r,4000);p.addEventListener('icegatheringstatechange',()=>{if(p.iceGatheringState==='complete'){clearTimeout(tm);r()}})})}
function showQr(el,text){window.__jpLastQr=text;el.innerHTML='';new QRCode(el,{text,width:560,height:560,correctLevel:QRCode.CorrectLevel.L})}
async function camWarmup(){try{const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(x=>x.stop())}catch(e){}} // unlocks real LAN addresses
function newPc(){
  pc=new RTCPeerConnection({iceServers:[]});
  pc.onconnectionstatechange=()=>{if(pc&&pc.connectionState==='failed')setStatus('hsFail','bad')};
}
function wire(ch){
  dc=ch;dc.binaryType='arraybuffer';
  dc.onopen=()=>{stopScan();['#hsQrBox','#hsCamBox','#hsHome'].forEach(s=>$(s).hidden=true);$('#hsConn').hidden=false;setStatus('connected','good');try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}};
  dc.onclose=()=>{if($('#hsConn').hidden===false)setStatus('hsFail','bad')};
  let cur=null;
  dc.onmessage=e=>{
    if(typeof e.data==='string'){const m=JSON.parse(e.data);
      if(m.t==='f'){cur={...m,parts:[],got:0,li:null};cur.li=row(m.name,m.size,'receiving')}
      else if(m.t==='e'&&cur){const b=new Blob(cur.parts,{type:cur.mime||'application/octet-stream'});cur.li.remove();addOut($('#hList'),b,cur.name);cur=null;try{navigator.vibrate&&navigator.vibrate(60)}catch(x){}}
      return}
    if(cur){cur.parts.push(e.data);cur.got+=e.data.byteLength;cur.li.querySelector('.mt').textContent=t('receiving')+' '+Math.round(cur.got/cur.size*100)+'%'}
  };
}
function row(name,size,k){const li=document.createElement('li'),d=document.createElement('div');d.innerHTML='<div class="nm"></div><div class="mt"></div>';d.firstChild.textContent=name;d.lastChild.textContent=t(k)+' · '+fmt(size);li.append(d);$('#hList').prepend(li);return li}
async function sendFiles(list){
  for(const f of list){
    const li=row(f.name,f.size,'sending');
    dc.send(JSON.stringify({t:'f',name:f.name,size:f.size,mime:f.type}));
    let off=0;dc.bufferedAmountLowThreshold=1<<20;
    while(off<f.size){if(dc.bufferedAmount>4<<20)await new Promise(r=>dc.addEventListener('bufferedamountlow',r,{once:true}));
      const b=await f.slice(off,off+65536).arrayBuffer();dc.send(b);off+=b.byteLength;li.querySelector('.mt').textContent=t('sending')+' '+Math.round(off/f.size*100)+'%'}
    dc.send(JSON.stringify({t:'e'}));li.querySelector('.mt').textContent=t('sent')+' · '+fmt(f.size);
  }
}
$('#hPick').onclick=()=>$('#hFile').click();
$('#hFile').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(dc&&dc.readyState==='open')sendFiles(fs)};
$('#hStart').onclick=async()=>{
  $('#hsHome').hidden=true;$('#hBack').hidden=false;setStatus('preparing');
  await camWarmup();newPc();wire(pc.createDataChannel('jp'));
  await pc.setLocalDescription(await pc.createOffer());await gathered(pc);
  $('#hsQrBox').hidden=false;$('#hsQrMsg').textContent=t('showToJoin');showQr($('#hsQr'),'JPH1|O|'+await pack({s:pc.localDescription.sdp}));
  $('#hsScanReply').hidden=false;setStatus('');
};
$('#hsScanReply').onclick=async()=>{
  $('#hsQrBox').hidden=true;$('#hsCamBox').hidden=false;$('#hsCamMsg').textContent=t('scanTheirReply');
  let busy=false;
  await startScan($('#hVid'),async txt=>{
    if(busy||!txt.startsWith('JPH1|'))return;if(!txt.startsWith('JPH1|A|')){setStatus('wrongQr','bad');return}
    busy=true;stopScan();setStatus('connecting');
    try{const o=await unpack(txt.slice(7));await pc.setRemoteDescription({type:'answer',sdp:o.s});$('#hsCamBox').hidden=true}catch(e){busy=false;setStatus('hsFail','bad')}
  });
};
$('#hJoin').onclick=async()=>{
  $('#hsHome').hidden=true;$('#hBack').hidden=false;$('#hsCamBox').hidden=false;$('#hsCamMsg').textContent=t('scanStart');
  let busy=false;
  await startScan($('#hVid'),async txt=>{
    if(busy||!txt.startsWith('JPH1|'))return;if(!txt.startsWith('JPH1|O|')){setStatus('wrongQr','bad');return}
    busy=true;stopScan();setStatus('preparing');
    try{
      const o=await unpack(txt.slice(7));newPc();pc.ondatachannel=e=>wire(e.channel);
      await pc.setRemoteDescription({type:'offer',sdp:o.s});await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
      $('#hsCamBox').hidden=true;$('#hsQrBox').hidden=false;$('#hsQrMsg').textContent=t('showReply');
      showQr($('#hsQr'),'JPH1|A|'+await pack({s:pc.localDescription.sdp}));setStatus('connecting');
    }catch(e){busy=false;setStatus('hsFail','bad')}
  });
};
$('#hBack').onclick=()=>{stopAll();setStatus('')};

/* ---------- test hooks (used for automated checks) ---------- */
window.__jpOffline={buildFrames,onFrame,rxReset,pack,unpack,get rx(){return rx}};

}
