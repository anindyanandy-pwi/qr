<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e4002b">
<meta name="description" content="QR দেখান, ফাইল পাঠান। কোনো অ্যাপ নয়, নম্বর সেভ নয়।">
<title>ঝটপট — QR দিয়ে ফাইল পাঠান</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Hind+Siliguri:wght@400;600;700&family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: plain, warm, for anyone - a railway ticket counter, not a tech product
   IDEA: the QR is a ticket: perforated stub, a short code like a PNR, tear-off feel
   PICTURE: the white ticket with the QR, large, floating on the page
   COLOUR and TYPE: white / ink / signal red; Hind Siliguri + Hind, Archivo for the code
   LAYOUT: one column: ticket, one instruction, one big action */
:root{color-scheme:light dark;--bg:light-dark(#f3f1ec,#0e0e0e);--ink:light-dark(#111,#f2f2f2);--mute:light-dark(#5b5b5b,#a8a8a8);--line:light-dark(#dcd8cf,#2a2a2a);--red:#e4002b;--card:light-dark(#fff,#181818);--ok:light-dark(#0a7a3d,#4cd38a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Hind Siliguri","Hind","Noto Sans Bengali","Noto Sans Devanagari",system-ui,sans-serif;overflow-x:clip}
main{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 18px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;flex:none}
h1{font-size:24px;line-height:1;margin:0;font-weight:700}
.tag{font-size:13px;color:var(--mute);line-height:1.2;margin-top:3px}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:15px;min-height:40px;padding:0 9px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.view{display:none}.view.on{display:block}

/* the ticket */
.ticket{background:#fff;color:#111;border-radius:22px;width:min(100%,420px);margin:0 auto;overflow:hidden;box-shadow:0 1px 0 #0000000d,0 18px 40px -18px #00000059}
.tk-head{display:flex;align-items:center;gap:10px;padding:14px 16px 2px}
.tk-head .thumbs{display:flex;gap:6px;flex:none}
.tk-head .thumbs .th{width:44px;height:44px}
.tk-head .sum{flex:1;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.tk-head .x{flex:none;font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #ddd;background:#fff;color:#111;cursor:pointer}
.qrbox{display:grid;place-items:center;width:100%;aspect-ratio:1;padding:20px;background:#fff;border:0;cursor:zoom-in;position:relative}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important;image-rendering:pixelated}
.qrbox.wait::after{content:"";width:44px;height:44px;border:5px solid #eee;border-top-color:var(--red);border-radius:50%;animation:r 1s linear infinite;position:absolute}
.perf{position:relative;border-top:2px dashed #d6d6d6;margin:0 22px}
.perf::before,.perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.perf::before{left:-36px}.perf::after{right:-36px}
.stub{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px 18px}
.stub small{display:block;color:#6b6b6b;font-size:13px;line-height:1.2}
.stub b{display:block;font:800 clamp(26px,7vw,34px)/1.1 Archivo,system-ui,sans-serif;letter-spacing:.1em;color:#111}
.stub .url{font-size:12px;color:#8a8a8a;overflow-wrap:anywhere}
.iconbtn{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid #ddd;background:#fff;color:#111;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}

.big{font-size:clamp(22px,5.5vw,28px);line-height:1.2;font-weight:700;text-align:center;margin:20px 0 4px;text-wrap:balance}
.sub{color:var(--mute);text-align:center;margin:0 0 8px}
.coach{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px auto 0;max-width:420px}
.coach svg{width:62px;height:80px;flex:none}
.coach b{display:block;font-size:17px}
.coach p{margin:2px 0 8px;color:var(--mute);font-size:15px;line-height:1.4}
.status{margin:14px 0;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:600;min-height:48px}
.status.bad{background:color-mix(in srgb,var(--red) 12%,var(--bg));border-color:transparent;color:light-dark(#9b001d,#ff8a9e)}
.status.good{color:var(--ok)}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:150px;border:3px dashed var(--ink);border-radius:20px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;padding:16px}
.pick b{font-size:28px;line-height:1.15;text-align:center}
.pick span{color:var(--mute);font-size:15px;text-align:center}
.pick.solid{border:0;background:var(--red);color:#fff;min-height:88px;margin:18px auto 0;max-width:420px}
.pick.solid b{font-size:22px}.pick.solid span{color:#ffe1e6}
.pick.drag{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--bg))}
.textlink{display:block;margin:14px auto 0;font:inherit;font-size:15px;color:var(--ink);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}
.codeform{display:flex;gap:8px;max-width:420px;margin:6px auto 0}
.codeform input{flex:1;font:800 22px/1 Archivo,system-ui,sans-serif;letter-spacing:.15em;text-transform:lowercase;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:14px}
textarea{flex:1;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical;min-height:52px}
.btn{font:inherit;font-weight:700;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--red);color:#fff;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.center{text-align:center;margin-top:14px}
.match{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:14px}
.match b{font:800 40px/1 Archivo,system-ui,sans-serif;color:var(--red);flex:none}
.match span{font-size:15px;line-height:1.35}
h2{font-size:17px;margin:26px 0 8px;color:var(--mute);font-weight:600}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px;align-items:start}
.item.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.97);background:color-mix(in srgb,var(--ok) 18%,var(--card))}100%{transform:none}}
.item>.th{grid-row:span 4;width:56px;height:56px}
.item.txt-item{grid-template-columns:minmax(0,1fr)}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .name{font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.item .meta{color:var(--mute);font-size:14px;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.item.done .bar{display:none}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.item a.save{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700}
.item .txt{overflow-wrap:anywhere;white-space:pre-wrap}
.item .txt a{color:var(--red)}
.itag{font-size:13px;font-weight:700;color:var(--mute)}
.itag.ok{color:var(--ok)}
.th{border-radius:10px;overflow:hidden;display:grid;place-items:center;background:#eee;color:#fff;font:800 12px/1 Archivo,system-ui,sans-serif;letter-spacing:.04em;position:relative}
.th img,.th video,.th canvas{width:100%;height:100%;object-fit:cover;background:#fff}
.th.more{background:#111}
.fsv{position:fixed;inset:0;background:#fff;color:#111;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;cursor:zoom-out}
.fsv img{width:min(92vw,78vh);image-rendering:pixelated}
.fsv b{font:800 clamp(34px,8vw,56px)/1 Archivo,system-ui,sans-serif;letter-spacing:.12em}
.fsv span{color:#666}
@keyframes r{to{transform:rotate(1turn)}}
.spin{width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--red);border-radius:50%;margin:30px auto;animation:r 1s linear infinite}
@media (prefers-reduced-motion:reduce){.spin,.qrbox.wait::after{animation:none}.bar i{transition:none}.item.pop{animation:none}}
@media (max-width:380px){.lang button{padding:0 7px;font-size:14px}h1{font-size:21px}.tag{display:none}}
.vochk{display:flex;gap:10px;align-items:flex-start;margin:12px 2px 0;font-size:15px;cursor:pointer;line-height:1.35}
.vochk input{width:22px;height:22px;accent-color:var(--red);flex:none;margin-top:1px}
.vov{position:fixed;inset:0;z-index:20;background:#111;color:#fff;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vov .vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#000}
.vov .vbar span{font-size:14px;color:#ccc}
.vov .vpages{flex:1;overflow:auto;padding:12px;display:grid;gap:12px;justify-items:center}
.vov canvas{max-width:100%;height:auto;background:#fff;border-radius:4px;pointer-events:none}
.vov.hide .vpages{filter:blur(24px)}
.lock{display:grid;place-items:center;background:#111!important;color:#fff;font-size:22px}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#e4002b"/><rect x="8" y="8" width="13" height="13" rx="3" fill="none" stroke="#fff" stroke-width="3"/><rect x="12.5" y="12.5" width="4" height="4" rx="1" fill="#fff"/><path d="M20 31 31 20M23.5 20H31v7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1 data-t="title"></h1><div class="tag" data-t="tagline"></div></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="bn">বাংলা</button><button data-l="hi">हिंदी</button><button data-l="en">EN</button>
    </div>
  </header>

  <!-- A QR ticket: "receive" (waiting) or "share" (files picked first) -->
  <section id="vQr" class="view">
    <div class="ticket">
      <div class="tk-head" id="staged" hidden><div class="thumbs" id="stThumbs"></div><div class="sum" id="stagedTxt"></div><button class="x" id="cancel" data-t="cancel"></button></div>
      <button class="qrbox wait" id="qr" data-al="fsOpen"></button>
      <div class="perf"></div>
      <div class="stub">
        <div><small data-t="codeLbl"></small><b id="code">· · · · · ·</b><div class="url" id="url"></div></div>
        <button class="iconbtn" id="fs" data-al="fsOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <p class="big" id="qrMsg"></p>
    <p class="sub" id="qrSub"></p>
    <div class="coach" id="coach" hidden>
      <svg viewBox="0 0 62 80" aria-hidden="true"><rect x="3" y="3" width="42" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="3"/><rect x="11" y="16" width="26" height="26" rx="2" fill="none" stroke="#e4002b" stroke-width="2.5" stroke-dasharray="7 12" stroke-dashoffset="3.5"/><path d="M14 29h20" stroke="#e4002b" stroke-width="2.5"/><path d="M48 40l10-6M48 46h11M48 52l10 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      <div><b data-t="coachT"></b><p data-t="coachP"></p><button class="btn ghost" id="coachOk" data-t="gotIt"></button></div>
    </div>
    <button class="pick solid" id="pickFirst"><b data-t="pickFirst"></b><span data-t="pickFirstSub"></span></button>
    <input type="file" id="file2" multiple hidden>
    <button class="textlink" id="codeToggle" data-t="noCam"></button>
    <form class="codeform" id="codeForm" hidden><input id="codeIn" maxlength="6" autocomplete="off" autocapitalize="off" spellcheck="false" data-ph="codePh"><button class="btn" data-t="join"></button></form>
  </section>

  <!-- Scanner side, before connection -->
  <section id="vJoin" class="view"><div class="spin"></div></section>

  <!-- Connected: both sides can send -->
  <section id="vConn" class="view">
    <div class="match"><b id="matchNum">--</b><span data-t="match"></span></div>
    <button class="pick" id="pick"><b data-t="pick"></b><span data-t="pickSub"></span></button>
    <input type="file" id="file" multiple hidden>
    <label class="vochk"><input type="checkbox" id="vo"><span data-t="voLbl"></span></label>
    <div class="row">
      <textarea id="text" rows="1" data-ph="textPh"></textarea>
      <button class="btn" id="sendText" data-t="sendText"></button>
    </div>
    <p class="sub" style="margin-top:10px" data-t="keepOpen"></p>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="center" id="againWrap" hidden><button class="btn ghost" id="again" data-t="again"></button></div>
  <div class="center" id="endWrap" hidden><button class="btn ghost" id="end" data-t="end"></button></div>
  <div class="center" id="installWrap" hidden><button class="btn ghost" id="install" data-t="install"></button><p class="sub" style="margin-top:6px" data-t="installSub"></p></div>

  <section id="histWrap" hidden>
    <h2 data-t="history"></h2>
    <ul class="list" id="hist"></ul>
  </section>
  <p class="sub" style="margin-top:32px;font-size:15px"><a href="desk.html" data-t="forDesk" style="color:inherit"></a> · <a href="shop.html" data-t="forShop" style="color:inherit"></a> · <a href="present.html" data-t="forPresent" style="color:inherit"></a> · <a href="offline.html" data-t="forOffline" style="color:inherit"></a></p>
</main>
<div class="fsv" id="fsv" hidden><img id="fsImg" alt=""><b id="fsCode"></b><span data-t="tapClose"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
{

const KIND=[[/pdf$/i,'#c62828'],[/docx?$|odt$|rtf$|txt$/i,'#1e5bb8'],[/xlsx?$|csv$|ods$/i,'#1d7a46'],[/pptx?$|odp$/i,'#c4511a'],[/zip$|rar$|7z$|gz$/i,'#5a5a5a'],[/mp3$|m4a$|wav$|ogg$|aac$|opus$/i,'#6b3fa0'],[/apk$/i,'#2e7d32']];
let pdfLib=null;
function loadPdf(){
  if(!pdfLib)pdfLib=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};s.onerror=rej;document.head.append(s)});
  return pdfLib;
}
function thumb(blob,name,mime){
  const el=document.createElement('div');el.className='th';
  const ext=(name.split('.').pop()||'').slice(0,4);
  const badge=()=>{el.textContent=ext.toUpperCase()||'FILE';el.style.background=(KIND.find(k=>k[0].test(ext))||[0,'#3a3a3a'])[1]};
  badge();
  if(!blob)return el;
  const url=URL.createObjectURL(blob);
  if(/^image\//.test(mime)){const im=new Image();im.alt='';im.onload=()=>{el.textContent='';el.append(im)};im.src=url}
  else if(/^video\//.test(mime)){const v=document.createElement('video');v.muted=true;v.preload='metadata';v.playsInline=true;v.onloadeddata=()=>{el.textContent='';el.append(v)};v.src=url+'#t=0.5'}
  else if((/pdf/.test(mime)||/^pdf$/i.test(ext))&&blob.size<40e6){
    loadPdf().then(async lib=>{const doc=await lib.getDocument({data:await blob.arrayBuffer()}).promise;const p=await doc.getPage(1);
      const v0=p.getViewport({scale:1}),vp=p.getViewport({scale:140/v0.width});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;el.textContent='';el.style.background='#fff';c.style.objectPosition='top';el.append(c)}).catch(()=>{});
  }
  return el;
}

/* ---------- feedback: chime + vibration ---------- */
let actx=null;
document.addEventListener('pointerdown',()=>{try{actx=actx||new AudioContext();actx.resume()}catch(e){}},{once:true});
function chime(){
  try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}
  try{actx=actx||new AudioContext();const t0=actx.currentTime;
    [880,1320].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),s=t0+i*.13;o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.18,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.45);o.connect(g).connect(actx.destination);o.start(s);o.stop(s+.5)})}catch(e){}
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFs()});

/* ---------- hosting a QR (receive mode or share mode) ---------- */
function hostQR(mode){
  role=mode;show('vQr');setStatus('making');applyLang();
  $('#pickFirst').hidden=mode==='share';$('#codeToggle').hidden=mode==='share';$('#codeForm').hidden=true;
  $('#coach').hidden=!!store.get('qrp-coach');
  if(mode==='share')renderStagedThumbs();
  const q=$('#qr');q.innerHTML='';q.classList.add('wait');$('#code').textContent='· · · · · ·';$('#url').textContent='';code='';
  $('#againWrap').hidden=true;$('#endWrap').hidden=true;
  if(!/^https:|^http:\/\/(localhost|127\.)/.test(location.href))setStatus('host','bad');
  const c=rid(6);
  peer=new Peer(PREFIX+c,{config:ICE});
  peer.on('open',()=>{
    code=c;q.innerHTML='';q.classList.remove('wait');
    new QRCode(q,{text:base+'#'+c,width:512,height:512,correctLevel:QRCode.CorrectLevel.L});
    $('#code').textContent=c.slice(0,3)+' '+c.slice(3);
    $('#url').textContent=base.replace(/^https?:\/\//,'').replace(/\/$/,'');
    if(statusKey!=='host')setStatus('ready');
    lockScreen();
  });
  peer.on('connection',cn=>{
    if(conn&&conn.open){cn.on('open',()=>{cn.send(JSON.stringify({t:'busy'}));setTimeout(()=>cn.close(),800)});return}
    setup(cn);
  });
  peer.on('error',peerErr);
  peer.on('disconnected',()=>{if(peer&&!peer.destroyed)setTimeout(()=>{try{if(peer.disconnected)peer.reconnect()}catch(e){}},1500)});
}
function joiner(c){
  role='join';show('vJoin');setStatus('joining');
  peer=new Peer({config:ICE});
  peer.on('open',()=>{
    setup(peer.connect(PREFIX+c,{serialization:'raw',reliable:true}));
    joinTimer=setTimeout(()=>{if(!(conn&&conn.open))fail('failConn')},25000);
  });
  peer.on('error',peerErr);
}
function peerErr(e){
  if(e.type==='unavailable-id'){peer.destroy();hostQR(role);return}
  if(conn&&conn.open&&/network|server-error|socket/.test(e.type))return; // signalling lost, direct link still alive
  fail(e.type==='peer-unavailable'?'expired':/network|server-error|socket|browser-incompatible/.test(e.type)?'noNet':'failConn');
}
function fail(k){setStatus(k,'bad');if(role==='join'){show('vJoin');$('#vJoin').innerHTML=''}
  $('#againWrap').hidden=false;$('#endWrap').hidden=true}
function matchNum(a,b){let h=0;for(const ch of[a,b].sort().join('|'))h=(h*31+ch.charCodeAt(0))>>>0;return 10+h%90}
function setup(c){
  conn=c;
  c.on('open',()=>{
    clearTimeout(joinTimer);closeFs();
    $('#matchNum').textContent=matchNum(peer.id,c.peer);
    show('vConn');setStatus('connected','good','…');$('#endWrap').hidden=false;$('#againWrap').hidden=true;
    c.send(JSON.stringify({t:'hi',dev:dev()}));lockScreen();chime();
    if(role==='share'){staged.texts.forEach(v=>{c.send(JSON.stringify({t:'x',v}));addText(v,'out')});sendFiles(staged.files)}
  });
  c.on('data',onData);
  c.on('close',()=>closed('closed'));
  c.on('error',()=>closed('failConn'));
  setTimeout(()=>{const pc=c.peerConnection;if(pc)pc.addEventListener('iceconnectionstatechange',()=>{if(pc.iceConnectionState==='failed'){if(c.open)closed('failConn');else fail('failConn')}})},0);
}
function closed(k){
  if(!conn)return;conn=null;queue.length=0;
  if(cur){setTag(cur.li,'failed');cur=null}
  for(const id in items){const li=items[id];if(li.querySelector('.itag').dataset.k==='sending'&&!li.classList.contains('done'))setTag(li,'failed')}
  $('#endWrap').hidden=true;
  if(role==='share'){show('vQr');setStatus('ready2','good');return} // same QR keeps working for the next person
  unlock();setStatus(k,'bad');$('#againWrap').hidden=false;
  if(role==='join'){show('vJoin');$('#vJoin').innerHTML=''}else{show('vQr');$('#qr').innerHTML='';$('#code').textContent='· · · · · ·';code=''}
}
function reset(){
  try{conn&&conn.close()}catch(e){}conn=null;
  try{peer&&peer.destroy()}catch(e){}peer=null;
  history.replaceState(null,'',base);$('#vJoin').innerHTML='<div class="spin"></div>';
}
function startShare(files,texts){reset();staged={files,texts};hostQR('share')}
$('#again').onclick=()=>{reset();staged={files:[],texts:[]};hostQR('recv')};
$('#end').onclick=()=>{if(busyOut&&!window.confirm(t('leave')))return;reset();staged={files:[],texts:[]};hostQR('recv')};
$('#cancel').onclick=$('#again').onclick;
$('#pickFirst').onclick=()=>$('#file2').click();
$('#file2').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)startShare(fs,[])};
$('#coachOk').onclick=()=>{store.set('qrp-coach','1');$('#coach').hidden=true};
$('#codeToggle').onclick=()=>{$('#codeForm').hidden=!$('#codeForm').hidden;if(!$('#codeForm').hidden)$('#codeIn').focus()};
$('#codeForm').onsubmit=e=>{
  e.preventDefault();const v=$('#codeIn').value.toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!/^[a-z0-9]{6}$/.test(v)||v===code){setStatus('badCode','bad');return}
  reset();location.hash=v;
};

/* ---------- receiving ---------- */
function onData(d){
  if(typeof d==='string'){
    let m;try{m=JSON.parse(d)}catch(e){return}
    if(m.t==='hi')setStatus('connected','good',String(m.dev||'').slice(0,30));
    else if(m.t==='busy'){conn.close();fail('busy')}
    else if(m.t==='viewed'&&items[m.id])setTag(items[m.id],'voSeen');
    else if(m.t==='f'){cur={id:m.id,name:String(m.name).slice(0,200)||'file',size:+m.size||0,mime:String(m.mime||''),vo:!!m.vo&&viewable(String(m.mime||''),String(m.name)),parts:[],got:0};cur.li=addItem(m.id,cur.name,cur.size,'in')}
    else if(m.t==='e'&&cur&&cur.id===m.id)finish();
    else if(m.t==='x'){addText(String(m.v).slice(0,20000),'in');chime()}
    else if(m.t==='ok'&&items[m.id])setTag(items[m.id],'sent');
    return;
  }
  if(!cur)return;
  cur.parts.push(d);cur.got+=d.byteLength??d.size??0;
  if(cur.parts.length%8===0||cur.got>=cur.size)prog(cur.li,cur.size?cur.got/cur.size:1);
}
function finish(){
  const f=cur;cur=null;
  const blob=new Blob(f.parts,{type:f.mime||'application/octet-stream'});f.parts=null;
  if(f.vo){voArrived(f,blob);return}
  const url=URL.createObjectURL(blob),li=f.li;
  li.firstElementChild.replaceWith(thumb(blob,f.name,f.mime));
  li.classList.add('done','pop');setTag(li,'got');
  const a=document.createElement('a');a.className='save';a.href=url;a.download=f.name;a.dataset.k='save';a.textContent=t('save');
  li.querySelector('.acts').append(a);
  if(!isIOS)try{a.click()}catch(e){}
  chime();
  conn&&conn.open&&conn.send(JSON.stringify({t:'ok',id:f.id}));
}


/* ---------- view-only files ---------- */
function viewable(mime,name){return /^image\//.test(mime)||/pdf/.test(mime)||/\.(pdf|png|jpe?g|webp|gif)$/i.test(name)}
function voArrived(f,blob){
  const li=f.li;const lk=document.createElement('div');lk.className='th lock';lk.textContent='🔒';li.firstElementChild.replaceWith(lk);
  li.classList.add('done','pop');setTag(li,'voTag');chime();
  const b=document.createElement('button');b.className='btn';b.dataset.k='view';b.textContent=t('view');
  b.onclick=()=>openVo(blob,f,()=>{blob=null;b.remove();setTag(li,'voGone');conn&&conn.open&&conn.send(JSON.stringify({t:'viewed',id:f.id}))});
  li.querySelector('.acts').append(b);
  conn&&conn.open&&conn.send(JSON.stringify({t:'ok',id:f.id}));
}
function stamp(cv){
  const x=cv.getContext('2d'),w=cv.width,h=cv.height,fs=Math.max(14,Math.round(w/28));
  const d=new Date(),txt=t('voMark')+' · '+dev()+' · '+d.toLocaleDateString()+' '+d.toLocaleTimeString().slice(0,5);
  x.save();x.font='700 '+fs+'px sans-serif';x.fillStyle='rgba(228,0,43,.22)';x.translate(w/2,h/2);x.rotate(-Math.PI/6);
  const tw=x.measureText(txt).width+fs*3;for(let yy=-h;yy<h;yy+=fs*4)for(let xx=-w*1.2;xx<w*1.2;xx+=tw)x.fillText(txt,xx,yy);x.restore();
}
async function openVo(blob,f,onClose){
  const ov=document.createElement('div');ov.className='vov';
  ov.innerHTML='<div class="vbar"><span></span><button class="btn"></button></div><div class="vpages"></div>';
  ov.querySelector('span').textContent=f.name;const cb=ov.querySelector('button');cb.textContent=t('voClose');
  ov.addEventListener('contextmenu',e=>e.preventDefault());ov.addEventListener('dragstart',e=>e.preventDefault());
  const hideOnBlur=()=>ov.classList.toggle('hide',document.visibilityState!=='visible');document.addEventListener('visibilitychange',hideOnBlur);
  const pages=ov.querySelector('.vpages'),W=Math.min(1600,Math.max(600,innerWidth*(devicePixelRatio||1)));
  document.body.append(ov);
  const close=()=>{document.removeEventListener('visibilitychange',hideOnBlur);pages.querySelectorAll('canvas').forEach(c=>{c.width=c.height=0});ov.remove();onClose()};
  cb.onclick=close;
  try{
    if(/^image\//.test(f.mime)||/\.(png|jpe?g|webp|gif)$/i.test(f.name)){
      const im=await createImageBitmap(blob),k=Math.min(1,W/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);stamp(c);pages.append(c);
    }else{
      const lib=await loadPdf();const doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
      for(let p=1;p<=Math.min(doc.numPages,60);p++){const pg=await doc.getPage(p);const v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:W/v0.width});
        const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;stamp(c);pages.append(c)}
    }
  }catch(e){pages.textContent=t('failed')}
}

/* ---------- sending ---------- */
const queue=[];let running=false;
function sendFiles(list){for(const f of list)queue.push(f);if(!running)pump()}
async function pump(){
  running=true;
  while(queue.length&&conn&&conn.open){try{await sendOne(queue.shift())}catch(e){}}
  running=false;
}
async function sendOne(f){
  const id=rid(),li=addItem(id,f.name,f.size,'out',f);
  if(f.size>1.5*(1<<30))setStatus('big','bad');
  busyOut++;
  try{
    const dc=conn.dataChannel;
    const max=Math.min(CHUNK,(conn.peerConnection&&conn.peerConnection.sctp&&conn.peerConnection.sctp.maxMessageSize)||CHUNK);
    dc.bufferedAmountLowThreshold=1<<20;
    const vo=$('#vo').checked&&viewable(f.type,f.name);if($('#vo').checked&&!vo)setStatus('voOnly','bad');if(vo)li.dataset.vo='1';
    conn.send(JSON.stringify({t:'f',id,name:f.name,size:f.size,mime:f.type,vo}));
    let off=0,n=0;
    while(off<f.size){
      if(!conn||!conn.open)throw 0;
      if(dc.bufferedAmount>HIGH)await new Promise(r=>dc.addEventListener('bufferedamountlow',r,{once:true}));
      const buf=await f.slice(off,off+max).arrayBuffer();
      conn.send(buf);off+=buf.byteLength;
      if(++n%8===0||off>=f.size)prog(li,off/f.size);
    }
    conn.send(JSON.stringify({t:'e',id}));
    li.classList.add('done');
  }catch(e){setTag(li,'failed');throw e}
  finally{busyOut--}
}
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{sendFiles([...e.target.files]);e.target.value=''};
function sendText(){const v=$('#text').value.trim();if(!v||!conn||!conn.open)return;conn.send(JSON.stringify({t:'x',v}));addText(v,'out');$('#text').value=''}
$('#sendText').onclick=sendText;
$('#text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});
const pk=$('#pick');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();pk.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();pk.classList.remove('drag')}));
document.addEventListener('drop',e=>{
  const fs=[...e.dataTransfer.files];if(!fs.length)return;
  if(conn&&conn.open)sendFiles(fs);else if(role!=='join')startShare(fs,[]);
});
document.addEventListener('paste',e=>{
  const ae=document.activeElement;if(ae===$('#text')||ae===$('#codeIn'))return;
  const fs=[...(e.clipboardData.files||[])],v=e.clipboardData.getData('text');
  if(conn&&conn.open){
    if(fs.length){e.preventDefault();sendFiles(fs)}else if(v){e.preventDefault();$('#text').value=v;sendText()}
  }else if(role!=='join'&&(fs.length||v.trim())){e.preventDefault();startShare(fs,fs.length?[]:[v.trim()])}
});

/* ---------- keep screen awake, warn before leaving ---------- */
async function lockScreen(){if(wake)return;try{wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}catch(e){}}
function unlock(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(code||conn))lockScreen()});
window.addEventListener('beforeunload',e=>{if(busyOut||cur){e.preventDefault();e.returnValue=t('leave')}});

/* ---------- install (Android) + share menu ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#installWrap').hidden=false});
$('#install').onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;$('#installWrap').hidden=true};
window.addEventListener('appinstalled',()=>{$('#installWrap').hidden=true});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
async function takeShared(){
  const files=[],texts=[];
  try{
    const c=await caches.open('qrp-share');
    for(const req of await c.keys()){
      const res=await c.match(req);
      if(req.url.endsWith('/text'))texts.push(await res.text());
      else{const b=await res.blob();files.push(new File([b],decodeURIComponent(res.headers.get('x-name')||'file'),{type:b.type}))}
      await c.delete(req);
    }
  }catch(e){}
  return{files,texts};
}

/* ---------- start ---------- */
applyLang();
if(typeof Peer==='undefined'||typeof QRCode==='undefined'){show('vQr');$('#qr').classList.remove('wait');$('#pickFirst').hidden=true;setStatus('noNet','bad')}
else{
  const h=location.hash.slice(1);
  if(h==='share')takeShared().then(s=>{if(s.files.length||s.texts.length)startShare(s.files,s.texts);else{reset();hostQR('recv')}});
  else if(/^[a-z0-9]{6,20}$/.test(h))joiner(h);
  else hostQR('recv');
}
window.addEventListener('hashchange',()=>location.reload());
}
